<section class="hoja" aria-labelledby="hoja-titulo">
  <div class="hoja__cabecera">
    <h2 id="hoja-titulo" class="hoja__titulo">Área de firma</h2>
    <p class="estado" role="status">
      @if (hasSignature()) {
        <span class="estado__chip estado__chip--lista">
          <svg viewBox="0 0 20 20" aria-hidden="true" focusable="false"><path d="M4.5 10.5l3.5 3.5 7.5-8"/></svg>
          Firma lista
        </span>
      } @else {
        <span class="estado__chip">
          <span class="estado__punto" aria-hidden="true"></span>
          Vacía
        </span>
      }
    </p>
  </div>

  <div class="canvas-wrapper">
    <canvas
      #canvas
      class="signature-canvas"
      role="img"
      [attr.aria-label]="'Área de firma. ' + (hasSignature() ? 'Con firma.' : 'Vacía.')"
    ></canvas>
    <div class="guia" aria-hidden="true">
      <span class="guia__x">X</span>
      <span class="guia__linea"></span>
      <span class="guia__leyenda">Firma</span>
    </div>
    <p class="pista" [class.pista--oculta]="hasSignature()" aria-hidden="true">Firma sobre la línea con el ratón, un lápiz o el dedo</p>
  </div>

  <div class="hoja__pie">
    <button
      type="button"
      class="boton boton--secundario"
      (click)="clearCanvas()"
      [disabled]="!hasSignature()"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 20h11"/><path d="M5.2 14.2l8.6-8.6a2 2 0 0 1 2.8 0l2.8 2.8a2 2 0 0 1 0 2.8L11.4 20H8.6l-3.4-3.4a2 2 0 0 1 0-2.4z"/><path d="M9.5 10.5l5 5"/></svg>
      Limpiar
    </button>

    <div class="descargas">
      <button
        type="button"
        class="boton boton--primario"
        (click)="downloadPNG()"
        [disabled]="!hasSignature()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M5 19h14"/></svg>
        Descargar PNG
      </button>

      <button
        type="button"
        class="boton boton--primario"
        (click)="downloadSVG()"
        [disabled]="!hasSignature()"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 4v10"/><path d="M8 10.5l4 4 4-4"/><path d="M5 19h14"/></svg>
        Descargar SVG
      </button>
    </div>
  </div>
</section>
